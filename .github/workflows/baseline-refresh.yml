name: Baseline Refresh

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DEBUG - decode actual OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 -c "
import base64, json, sys
payload = '$TOKEN'.split('.')[1]
payload += '=' * (-len(payload) % 4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::241765568243:role/drift-gate-actions-oidc-role
          aws-region: us-east-1

      - name: Build git bundle
        run: git bundle create /tmp/baseline.bundle --all

      - name: Upload to S3
        run: |
          SHA="${{ github.sha }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          aws s3 cp /tmp/baseline.bundle "s3://codeintent-drift-gate-baselines-241765568243/baselines/${OWNER}/${REPO}/${SHA}.bundle"
          aws s3 cp /tmp/baseline.bundle "s3://codeintent-drift-gate-baselines-241765568243/baselines/${OWNER}/${REPO}/latest.bundle"


